[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://thetoolshed.netlify.app/*"
  to = "https://thetoolshed.work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap-index.xml"
  to = "/sitemap.xml"
  status = 301
  force = true

[[redirects]]
  from = "/guides"
  to = "/blog"
  status = 301
  force = true

[[redirects]]
  from = "/guides/*"
  to = "/blog"
  status = 301
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    Pragma = "no-cache"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    Pragma = "no-cache"
    X-Robots-Tag = "noindex, nofollow, noarchive"
