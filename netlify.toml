[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Permanently move the default Netlify production URL to the primary domain.
[[redirects]]
  from = "https://thetoolshed.netlify.app/*"
  to = "https://thetoolshed.work/:splat"
  status = 301
  force = true

# Keep the old sitemap path working while making the canonical sitemap /sitemap.xml.
[[redirects]]
  from = "/sitemap-index.xml"
  to = "/sitemap.xml"
  status = 301
  force = true

# Never cache protected admin pages or admin API responses at the CDN.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    Pragma = "no-cache"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    Pragma = "no-cache"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# The @astrojs/netlify adapter generates the required Netlify Functions
# configuration automatically at build time.
