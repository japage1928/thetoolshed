[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Permanently move the default Netlify production URL to the primary domain.
[[redirects]]
  from = "https://thetoolshed.netlify.app/*"
  to = "https://thetoolshed.work/:splat"
  status = 301
  force = true

# Never cache protected admin pages or admin API responses at the CDN.
# This is especially important on custom domains so an old authenticated/unauthenticated
# response cannot be replayed after the server-side auth middleware has changed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    Pragma = "no-cache"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
    Pragma = "no-cache"

# The @astrojs/netlify adapter generates the required Netlify Functions
# configuration automatically at build time (for the dynamic /api/blog/publish
# route). No manual [functions] block is needed.
